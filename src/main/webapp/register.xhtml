<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="title">Student Registration - Campus Canteen</ui:define>

    <ui:define name="content">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card canteen-card shadow-sm p-4 mt-2">
                    <div class="text-center mb-4">
                        <div class="display-6 text-danger mb-2">
                            <i class="bi bi-person-plus"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Student Registration</h3>
                        <p class="text-muted small">Create an account to browse canteen stalls and place pre-orders</p>
                    </div>

                    <h:form id="registerForm">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-semibold">Full Name</label>
                                <h:inputText id="fullName"
                                             value="#{authBean.regFullName}"
                                             styleClass="form-control"
                                             required="true"
                                             requiredMessage="Full name is required."/>
                                <h:message for="fullName" styleClass="text-danger small"/>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Username</label>
                                <h:inputText id="username"
                                             value="#{authBean.regUsername}"
                                             styleClass="form-control"
                                             required="true"
                                             requiredMessage="Username is required."/>
                                <h:message for="username" styleClass="text-danger small"/>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Mobile Number</label>
                                <h:inputText id="phone"
                                             value="#{authBean.regPhone}"
                                             styleClass="form-control"/>
                                <h:message for="phone" styleClass="text-danger small"/>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">College Email</label>
                                <h:inputText id="email"
                                             value="#{authBean.regEmail}"
                                             styleClass="form-control"
                                             required="true"
                                             requiredMessage="Email is required."/>
                                <h:message for="email" styleClass="text-danger small"/>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Password</label>
                                <h:inputSecret id="password"
                                               value="#{authBean.regPassword}"
                                               styleClass="form-control"
                                               required="true"
                                               requiredMessage="Password is required."/>
                                <h:message for="password" styleClass="text-danger small"/>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Confirm Password</label>
                                <h:inputSecret id="confirmPassword"
                                               value="#{authBean.regConfirmPassword}"
                                               styleClass="form-control"
                                               required="true"
                                               requiredMessage="Confirm your password."/>
                                <h:message for="confirmPassword" styleClass="text-danger small"/>
                            </div>

                            <div class="col-12 mt-4">
                                <h:commandButton value="Create Student Account"
                                                 action="#{authBean.register}"
                                                 styleClass="btn btn-canteen w-100 py-2 fw-bold"/>
                            </div>
                        </div>
                    </h:form>

                    <div class="text-center pt-3 border-top mt-3">
                        <span class="text-muted small">Already have an account? </span>
                        <h:link outcome="/login.xhtml" styleClass="fw-bold text-danger text-decoration-none">
                            Sign In
                        </h:link>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
</html>
