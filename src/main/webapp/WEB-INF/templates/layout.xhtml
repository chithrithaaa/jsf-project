<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title><ui:insert name="title">Campus Canteen</ui:insert> | Food Pre-Ordering System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <!-- Custom CSS -->
    <h:outputStylesheet name="css/custom.css"/>
</h:head>
<h:body>
    <ui:include src="/WEB-INF/templates/header.xhtml"/>

    <main class="main-content py-4">
        <div class="container">
            <!-- Global Flash Messages -->
            <h:messages globalOnly="true"
                        infoClass="alert alert-success alert-dismissible fade show"
                        warnClass="alert alert-warning alert-dismissible fade show"
                        errorClass="alert alert-danger alert-dismissible fade show"
                        layout="table"
                        style="width: 100%; border: none;"/>

            <ui:insert name="content">
                <!-- Page content goes here -->
            </ui:insert>
        </div>
    </main>

    <ui:include src="/WEB-INF/templates/footer.xhtml"/>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
